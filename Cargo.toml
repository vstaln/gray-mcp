[package]
name = "gray-mcp"
license = "MIT"
description = "MCP for the gray agent harness: client (servers from mcp.json → gray tools, wire v1.3) and server (`gray mcp serve`)."
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4"
rmcp = { version = "=3.5.0", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "sync", "time", "fs"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "gray_mcp"
path = "src/lib.rs"

[[bin]]
name = "gray-mcp"
path = "src/main.rs"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
